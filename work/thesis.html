<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%237F7EFF'/></svg>"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keyaa Kapadia - Thesis Journal</title>
  <link rel="stylesheet" href="../shared.css"/>
  <style>
    :root {
      --thesis-line: rgba(17, 17, 17, 0.1);
    }

    body {
      opacity: 0;
      animation: pageFade .6s ease .03s forwards;
    }

    .topbar {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      transition: background .25s ease;
    }

    .topbar.scrolled {
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .topbar::after {
      opacity: 0;
      transition: opacity .25s ease;
    }

    .topbar.scrolled::after {
      opacity: 1;
    }

    .project-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(18px, 2.4vw, 28px) var(--page-pad) clamp(64px, 7vw, 96px);
    }

    .gate {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
      opacity: 0;
      animation: fadeUp .55s ease .12s forwards;
    }

    .gate-mark {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(127, 126, 255, 0.12);
      color: var(--accent);
      font-size: 18px;
    }

    .gate-title {
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.05;
      letter-spacing: -.03em;
      color: var(--ink);
    }

    .gate-copy {
      max-width: 34ch;
      color: var(--muted);
      font-size: var(--text-body);
      font-weight: 400;
    }

    .gate-form {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      width: 100%;
      justify-content: center;
    }

    .gate-input {
      width: clamp(200px, 26vw, 260px);
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid var(--thesis-line);
      background: #fff;
      font-family: inherit;
      font-size: var(--text-small);
      color: var(--ink);
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .gate-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(127, 126, 255, 0.16);
    }

    .gate-submit {
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      background: var(--ink);
      color: #fff;
      font-family: inherit;
      font-size: var(--text-small);
      font-weight: 500;
      cursor: pointer;
      transition: opacity .2s ease;
    }

    .gate-submit:hover {
      opacity: .82;
    }

    .gate-submit:disabled {
      opacity: .6;
      cursor: default;
    }

    .gate-error {
      min-height: 18px;
      font-size: var(--text-caption);
      color: #c0503f;
    }

    footer {
      opacity: 0;
      animation: fadeUp .5s ease .45s forwards;
    }

    @media (max-width: 680px) {
      .gate-form {
        flex-direction: column;
      }

      .gate-input,
      .gate-submit {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="cur"></div>
  <div id="grad"></div>

  <div class="topbar" id="topbar">
    <div class="topbar-inner">
      <nav class="top">
        <a class="nav-name" href="../index.html">Keyaa Kapadia</a>
        <div class="nav-links">
          <a href="../work/work.html" class="active">Work</a>
          <a href="../play/play.html">Play</a>
          <a href="../about/about.html">About</a>
        </div>
      </nav>
    </div>
  </div>

  <main class="project-page">
    <section class="gate" id="gate">
      <div class="gate-mark">&#128274;</div>
      <h1 class="gate-title">Thesis Journal</h1>
      <p class="gate-copy">Private. Enter this week's password to open it.</p>
      <form class="gate-form" id="gateForm">
        <input class="gate-input" id="gatePassword" type="password" placeholder="Password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <button class="gate-submit" type="submit" id="gateSubmit">Enter</button>
      </form>
      <p class="gate-error" id="gateError"></p>
    </section>
  </main>

  <footer>
    <div class="fl">
      <a href="mailto:kapadiakeyaa@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/keyaa-kapadia-188619aa/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://www.instagram.com/keyaakapadia/?hl=en" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="../resume.html">Resume</a>
    </div>
    <div>All rights reserved © Keyaa Kapadia <span id="yr"></span></div>
  </footer>

  <script>
    // Password rotates weekly: reverse of "week<N>" (e.g. week3 -> "3keew").
    // Week 1 is the first Friday-to-Thursday cycle after classes started
    // the week of Mon Aug 25, 2026, so weeks flip over every Friday from there.
    const WEEK1_CYCLE_START = new Date(2026, 7, 28); // Fri, Aug 28 2026
    const JOURNAL_URL = 'https://keyaakapadia.github.io/Thesis-Journal/';
    const SESSION_KEY = 'thesisJournalUnlocked';

    function getCurrentWeekNumber(date = new Date()) {
      const msPerDay = 24 * 60 * 60 * 1000;
      const start = new Date(WEEK1_CYCLE_START.getFullYear(), WEEK1_CYCLE_START.getMonth(), WEEK1_CYCLE_START.getDate());
      const today = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const diffDays = Math.floor((today - start) / msPerDay);
      return Math.max(Math.floor(diffDays / 7) + 1, 1);
    }

    function getExpectedPassword(date = new Date()) {
      return `week${getCurrentWeekNumber(date)}`.split('').reverse().join('');
    }

    const cur = document.getElementById('cur');
    const topbar = document.getElementById('topbar');
    const yearEl = document.getElementById('yr');
    const gateForm = document.getElementById('gateForm');
    const gateInput = document.getElementById('gatePassword');
    const gateSubmit = document.getElementById('gateSubmit');
    const gateError = document.getElementById('gateError');

    try {
      if (sessionStorage.getItem(SESSION_KEY) === 'true') {
        window.location.replace(JOURNAL_URL);
      }
    } catch (err) {
      // sessionStorage unavailable — fall back to always showing the gate
    }

    gateForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const entered = gateInput.value.trim().toLowerCase();

      if (entered && entered === getExpectedPassword()) {
        try {
          sessionStorage.setItem(SESSION_KEY, 'true');
        } catch (err) {
          // ignore storage errors, redirect anyway
        }
        gateError.textContent = '';
        gateSubmit.disabled = true;
        window.location.href = JOURNAL_URL;
      } else {
        gateError.textContent = 'Incorrect password. Try again.';
        gateInput.value = '';
        gateInput.focus();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!cur) return;
      cur.style.left = `${e.clientX}px`;
      cur.style.top = `${e.clientY}px`;
    });

    document.querySelectorAll('a').forEach((el) => {
      el.addEventListener('mouseenter', () => document.body.classList.add('hov'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('hov'));
    });

    if (yearEl) {
      yearEl.textContent = new Date().getFullYear();
    }

    function handleTopbarScroll() {
      if (!topbar) return;
      if (window.scrollY > 10) {
        topbar.classList.add('scrolled');
      } else {
        topbar.classList.remove('scrolled');
      }
    }

    handleTopbarScroll();
    window.addEventListener('scroll', handleTopbarScroll, { passive: true });
  </script>
</body>
</html>
